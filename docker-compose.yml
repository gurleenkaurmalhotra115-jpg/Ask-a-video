services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vidquery
      POSTGRES_PASSWORD: vidquery_dev_password
      POSTGRES_DB: vidquery
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidquery"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://vidquery:vidquery_dev_password@postgres:5432/vidquery
    ports:
      - "8000:8000"
    volumes:
      - ./qdrant_data:/app/qdrant_data
      - ./cache:/app/cache
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./qdrant_data:/app/qdrant_data
      - ./cache:/app/cache
      - ./logs:/app/logs
    depends_on:
      - api

  mcp:
    build: .
    command: python mcp_server.py
    env_file:
      - .env
    volumes:
      - ./qdrant_data:/app/qdrant_data
      - ./cache:/app/cache
    depends_on:
      - api

volumes:
  pg_data:
